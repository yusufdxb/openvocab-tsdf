# NICE-SLAM demo scene (from Demo.zip). ~500 RGB-D frames, real imagery.
# Depth is uint16 * 1000 / m.  Bounds auto-fit from the first pose.

dataset:
  name: nice_slam_demo
  root: ~/data/replica
  scene: Demo
  max_frames: null
  stride: 1

camera:
  depth_scale: 1000.0
  depth_trunc_m: 6.0

mapping:
  voxel_size_m: 0.06
  truncation_distance_m: 0.24
  hash_capacity: 1048576
  block_size: 8
  backend: reference
  device: cuda:0
  store_color: true
  store_features: true
  feature_dim: 512
  # Trajectory extent is ~[2..4] × [2..3] × [1.3..1.7]; surface may reach
  # ~3 m beyond. Bound the dense volume explicitly to keep VRAM bounded.
  bounds_min: [-0.5, -0.5, -1.0]
  bounds_max: [7.0, 6.0, 4.5]
  max_weight: 32.0

semantics:
  model: ViT-B-16
  pretrained: laion2b_s34b_b88k
  mode: patch
  batch_size: 16
  device: cuda:0
  dtype: fp16

grounding:
  top_k: 5
  score_threshold: 0.22
  cluster_eps_vox: 2
  min_cluster_voxels: 8

logging:
  level: INFO
  rich_tracebacks: true
