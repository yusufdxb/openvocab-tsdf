# Replica office0 — 4 cm voxels, SAM-per-mask CLIP dense features, block_hash backend.
#
# This matches the room-scale 4 cm block-hash SAM sweep used for the Replica
# multi-scene aggregate. The goal is apples-to-apples comparison against the
# already-published room0 4 cm run and the new room1/room2/office1-4 runs.

dataset:
  name: replica
  root: ~/data/replica/Replica
  scene: office0
  max_frames: 100
  stride: 20

camera:
  depth_scale: 6553.5
  depth_trunc_m: 6.0

mapping:
  voxel_size_m: 0.04
  truncation_distance_m: 0.16
  block_size: 8
  backend: block_hash
  device: cuda:0
  store_color: true
  store_features: true
  feature_dim: 512
  bounds_min: [-2.5, -3.5, -1.7]
  bounds_max: [2.9, 2.4, 2.0]
  auto_bounds_radius_m: 5.0
  max_weight: 32.0
  initial_feat_capacity: 262144
  max_feat_capacity: 8000000

semantics:
  model: ViT-B-16
  pretrained: laion2b_s34b_b88k
  mode: sam_dense
  batch_size: 32
  device: cuda:0
  dtype: fp16

grounding:
  top_k: 5
  score_threshold: 0.22
  cluster_eps_vox: 2
  min_cluster_voxels: 8

logging:
  level: INFO
  rich_tracebacks: true
