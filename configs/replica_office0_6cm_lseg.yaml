# Replica office0 — 6 cm voxels, LSeg dense features, block_hash backend.
#
# LSeg produces per-pixel 512-d features aligned with CLIP ViT-B/32.
# No SAM masks — single forward pass per frame.

dataset:
  name: replica
  root: ~/data/replica/Replica
  scene: office0
  max_frames: 100
  stride: 20

camera:
  depth_scale: 6553.5
  depth_trunc_m: 6.0

mapping:
  voxel_size_m: 0.06
  truncation_distance_m: 0.24
  block_size: 8
  backend: block_hash
  device: cuda:0
  store_color: true
  store_features: true
  feature_dim: 512
  bounds_min: [-2.0, -3.0, -2.0]
  bounds_max: [7.0, 5.0, 3.0]
  auto_bounds_radius_m: 5.0
  max_weight: 32.0
  initial_feat_capacity: 262144
  max_feat_capacity: 8000000

semantics:
  mode: lseg
  model: ViT-B-32
  pretrained: openai
  lseg_weights_path: ~/.cache/openvocab_tsdf/weights/lseg_minimal_e200.ckpt
  device: cuda:0

grounding:
  top_k: 5
  score_threshold: 0.22
  cluster_eps_vox: 2
  min_cluster_voxels: 8

logging:
  level: INFO
  rich_tracebacks: true
