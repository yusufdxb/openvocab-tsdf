# Replica office0 — 6 cm voxels, SAM-per-mask CLIP dense features.
# SAM runs ~1.6 s/frame so we stride 20× (100 frames) to keep the encode <3 min.
# The reference backend is forced because sparse_feature does not support
# full-resolution dense_feature_map yet.

dataset:
  name: replica
  root: ~/data/replica/Replica
  scene: office0
  max_frames: 100
  stride: 20

camera:
  depth_scale: 6553.5
  depth_trunc_m: 6.0

mapping:
  voxel_size_m: 0.06
  truncation_distance_m: 0.24
  hash_capacity: 1048576
  block_size: 8
  backend: reference
  device: cuda:0
  store_color: true
  store_features: true
  feature_dim: 512
  bounds_min: [-2.5, -3.5, -1.5]
  bounds_max: [2.9, 2.4, 2.0]
  auto_bounds_radius_m: 4.0
  max_weight: 32.0

semantics:
  model: ViT-B-16
  pretrained: laion2b_s34b_b88k
  mode: sam_dense
  batch_size: 32
  device: cuda:0
  dtype: fp16

grounding:
  top_k: 5
  score_threshold: 0.22
  cluster_eps_vox: 2
  min_cluster_voxels: 8

logging:
  level: INFO
  rich_tracebacks: true
