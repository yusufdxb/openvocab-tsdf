# Replica office0 — 6 cm voxels, stride=4 / 500 frames, sparse backend, global CLIP.
# Bounds derived from scripts/inspect_replica_mesh.py: x∈[-2,2.4], y∈[-3.15,1.86], z∈[-1.2,1.8]

dataset:
  name: replica
  root: ~/data/replica/Replica
  scene: office0
  max_frames: 500
  stride: 4

camera:
  depth_scale: 6553.5
  depth_trunc_m: 6.0

mapping:
  voxel_size_m: 0.06
  truncation_distance_m: 0.24
  hash_capacity: 1048576
  block_size: 8
  backend: sparse_feature
  feat_update_backend: triton
  initial_feat_capacity: 262144
  max_feat_capacity: 2000000
  device: cuda:0
  store_color: true
  store_features: true
  feature_dim: 512
  bounds_min: [-2.5, -3.5, -1.5]
  bounds_max: [2.9, 2.4, 2.0]
  auto_bounds_radius_m: 4.0
  max_weight: 32.0

semantics:
  model: ViT-B-16
  pretrained: laion2b_s34b_b88k
  mode: global
  batch_size: 16
  device: cuda:0
  dtype: fp16

grounding:
  top_k: 5
  score_threshold: 0.22
  cluster_eps_vox: 2
  min_cluster_voxels: 8

logging:
  level: INFO
  rich_tracebacks: true
