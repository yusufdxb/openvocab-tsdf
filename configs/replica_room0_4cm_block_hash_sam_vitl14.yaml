# Replica room0 — 4 cm voxels, SAM-per-mask CLIP dense features, ViT-L/14 encoder.
#
# Identical to replica_room0_4cm_block_hash_sam.yaml except:
#   - semantics.model: ViT-L-14 (768-d instead of 512-d)
#   - semantics.pretrained: laion2b_s32b_b82k
#   - mapping.feature_dim: 768

dataset:
  name: replica
  root: ~/data/replica/Replica
  scene: room0
  max_frames: 100
  stride: 20

camera:
  depth_scale: 6553.5
  depth_trunc_m: 6.0

mapping:
  voxel_size_m: 0.04
  truncation_distance_m: 0.16
  block_size: 8
  backend: block_hash
  device: cuda:0
  store_color: true
  store_features: true
  feature_dim: 768
  bounds_min: [-2.0, -3.0, -2.0]
  bounds_max: [7.0, 5.0, 3.0]
  auto_bounds_radius_m: 5.0
  max_weight: 32.0
  initial_feat_capacity: 262144
  max_feat_capacity: 8000000

semantics:
  model: ViT-L-14
  pretrained: laion2b_s32b_b82k
  mode: sam_dense
  batch_size: 16
  device: cuda:0
  dtype: fp16

grounding:
  top_k: 5
  score_threshold: 0.22
  cluster_eps_vox: 2
  min_cluster_voxels: 8

logging:
  level: INFO
  rich_tracebacks: true
