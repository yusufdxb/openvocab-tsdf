# Replica room0 — 4 cm voxels, full 2000-frame trajectory, sparse backend.
# Dense 512-d features at 4 cm would be ~11 GB; sparse drops that to ~3–4 GB.

dataset:
  name: replica
  root: ~/data/replica/Replica
  scene: room0
  max_frames: null          # all 2000 frames
  stride: 1

camera:
  depth_scale: 6553.5
  depth_trunc_m: 6.0

mapping:
  voxel_size_m: 0.04
  truncation_distance_m: 0.16
  hash_capacity: 1048576
  block_size: 8
  backend: sparse_feature
  feat_update_backend: triton
  initial_feat_capacity: 524288
  max_feat_capacity: 4000000
  device: cuda:0
  store_color: true
  store_features: true
  feature_dim: 512
  bounds_min: [-2.0, -3.0, -2.0]
  bounds_max: [7.0, 5.0, 3.0]
  auto_bounds_radius_m: 5.0
  max_weight: 32.0

semantics:
  model: ViT-B-16
  pretrained: laion2b_s34b_b88k
  mode: global
  batch_size: 16
  device: cuda:0
  dtype: fp16

grounding:
  top_k: 5
  score_threshold: 0.22
  cluster_eps_vox: 3        # 3 vox * 4 cm = 12 cm connectivity
  min_cluster_voxels: 30

logging:
  level: INFO
  rich_tracebacks: true
