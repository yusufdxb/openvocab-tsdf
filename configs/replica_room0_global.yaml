# Replica room0 — global CLIP features variant (same map, different encoding).
# All other settings identical to replica_room0.yaml so the ablation is clean.

dataset:
  name: replica
  root: ~/data/replica/Replica
  scene: room0
  max_frames: 500
  stride: 4

camera:
  depth_scale: 6553.5
  depth_trunc_m: 6.0

mapping:
  voxel_size_m: 0.06
  truncation_distance_m: 0.24
  hash_capacity: 1048576
  block_size: 8
  backend: reference
  device: cuda:0
  store_color: true
  store_features: true
  feature_dim: 512
  bounds_min: [-2.0, -3.0, -2.0]
  bounds_max: [7.0, 5.0, 3.0]
  auto_bounds_radius_m: 5.0
  max_weight: 32.0

semantics:
  model: ViT-B-16
  pretrained: laion2b_s34b_b88k
  mode: global        # <-- differs from replica_room0.yaml
  batch_size: 16
  device: cuda:0
  dtype: fp16

grounding:
  top_k: 5
  score_threshold: 0.22
  cluster_eps_vox: 2
  min_cluster_voxels: 8

logging:
  level: INFO
  rich_tracebacks: true
