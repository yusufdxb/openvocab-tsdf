# Replica room2 — 4 cm voxels, SAM-per-mask CLIP dense features, block_hash backend.
#
# This is the end-to-end probe of the combined backend (block-hash geometry +
# per-voxel sparse features) at room scale with the strongest semantic path
# currently shipped (SAM-dense). At warehouse scale the block_hash backend is
# the only one that fits in VRAM; at room scale it's a correctness check.
#
# Expected: hit@1 within ±5 pp of the room0_6cm_sam baseline (55.6 % hit@1),
# trending up at the finer voxel size.

dataset:
  name: replica
  root: ~/data/replica/Replica
  scene: room2
  max_frames: 100
  stride: 20

camera:
  depth_scale: 6553.5
  depth_trunc_m: 6.0

mapping:
  voxel_size_m: 0.04
  truncation_distance_m: 0.16
  block_size: 8
  backend: block_hash
  device: cuda:0
  store_color: true
  store_features: true
  feature_dim: 512
  bounds_min: [-1.3, -3.8, -2.8]
  bounds_max: [6.5, 2.2, 1.2]
  auto_bounds_radius_m: 5.0
  max_weight: 32.0
  initial_feat_capacity: 262144
  max_feat_capacity: 8000000

semantics:
  model: ViT-B-16
  pretrained: laion2b_s34b_b88k
  mode: sam_dense
  batch_size: 32
  device: cuda:0
  dtype: fp16

grounding:
  top_k: 5
  score_threshold: 0.22
  cluster_eps_vox: 2
  min_cluster_voxels: 8

logging:
  level: INFO
  rich_tracebacks: true
