# Replica office2 — hand-annotated ground-truth eval spec.
#
# The NICE-SLAM RGB-D dump does not ship semantic labels (upstream Meta
# release does, via a separate form-gated download). Bboxes below were
# derived from direct mesh inspection: floor/ceiling from the two strongest
# horizontal-surface peaks in the z histogram, object bboxes from an
# interior spatial density map projected onto the xy plane.
#
# Caveats:
#   * Bboxes are conservatively wide (~1.4 m on a side) since we are scoring
#     on cluster centroid, not IoU.
#   * "the floor" / "the ceiling" bboxes are *exact* plane locations from the
#     mesh and function as a geometric sanity check.
#   * Object classes are best-guess from the density map; some entries may
#     map to nearby objects. Treat this eval as relative-ordering rather than
#     absolute accuracy.
#
# Regenerate/refine: `python scripts/inspect_replica_mesh.py --scene office2`.

model: ViT-B-16
pretrained: laion2b_s34b_b88k
device: cuda:0
dtype: fp16

top_percentile: 0.005
cluster_eps_vox: 2
min_cluster_voxels: 20
top_k: 5
bbox_slack_m: 0.2

cases:
  # ---- Structural / geometry-derivable ground truth ----
  - query: "the floor"
    bbox_min: [-3.43, -2.85, -1.30]
    bbox_max: [3.05, 5.30, -1.10]
    kind: structural
  - query: "the ceiling"
    bbox_min: [-3.43, -2.85, 1.41]
    bbox_max: [3.05, 5.30, 1.61]
    kind: structural

  # ---- Objects: hand-annotated from mesh density map ----
  - query: "a desk"
    # North dense cluster, x in [+0.0, +1.5], y in [+3.5, +5.0]
    bbox_min: [-0.1, 3.4, -1.20]
    bbox_max: [1.6, 5.0, -0.2]
    kind: object
  - query: "a chair"
    # South-east cluster around (+0.5, -2.0)
    bbox_min: [-0.2, -2.5, -1.20]
    bbox_max: [1.4, -1.2, -0.2]
    kind: object
  - query: "a monitor"
    # Above north desk region, mid-z band
    bbox_min: [-0.1, 3.4, -0.4]
    bbox_max: [1.6, 5.0, 0.5]
    kind: loose
  - query: "a bookshelf"
    # East-edge dense column at x ≈ +2.3, y in [+0.5, +2.0]
    bbox_min: [1.8, 0.4, -1.20]
    bbox_max: [3.05, 2.1, 1.3]
    kind: object
  - query: "a couch"
    # South-central cluster at (-1.0, -2.0); could be seating
    bbox_min: [-1.8, -2.6, -1.20]
    bbox_max: [-0.4, -1.5, -0.2]
    kind: loose
  - query: "a lamp"
    # Far west tall column around (-2.5, +0.5)
    bbox_min: [-3.0, -0.3, -1.20]
    bbox_max: [-1.8, 1.6, 1.2]
    kind: loose

  # ---- Structural wall band ----
  - query: "a window"
    # Northern wall y ≈ +5.2, full x, mid-z height
    bbox_min: [-3.43, 5.0, -0.5]
    bbox_max: [3.05, 5.30, 1.2]
    kind: structural
