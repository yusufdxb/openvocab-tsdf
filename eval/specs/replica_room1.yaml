# Replica room1 — hand-annotated ground-truth eval spec.
#
# The NICE-SLAM RGB-D dump does not ship semantic labels (upstream Meta
# release does, via a separate form-gated download). Bboxes below were
# derived from direct mesh inspection: floor/ceiling from the two strongest
# horizontal-surface peaks in the z histogram, object bboxes from an
# interior spatial density map projected onto the xy plane.
#
# Caveats:
#   * Bboxes are conservatively wide (~1.4 m on a side) since we are scoring
#     on cluster centroid, not IoU.
#   * "the floor" / "the ceiling" bboxes are *exact* plane locations from the
#     mesh and function as a geometric sanity check.
#   * Object classes are best-guess from the density map; some entries may
#     map to nearby objects. Treat this eval as relative-ordering rather than
#     absolute accuracy.
#
# Regenerate/refine: `python scripts/inspect_replica_mesh.py --scene room1`.

model: ViT-B-16
pretrained: laion2b_s34b_b88k
device: cuda:0
dtype: fp16

top_percentile: 0.005
cluster_eps_vox: 2
min_cluster_voxels: 20
top_k: 5
bbox_slack_m: 0.2

cases:
  # ---- Structural / geometry-derivable ground truth ----
  - query: "the floor"
    bbox_min: [-5.40, -3.04, -1.48]
    bbox_max: [1.24, 2.69, -1.28]
    kind: structural
  - query: "the ceiling"
    bbox_min: [-5.40, -3.04, 1.22]
    bbox_max: [1.24, 2.69, 1.42]
    kind: structural

  # ---- Objects: hand-annotated from mesh density map ----
  - query: "a sofa"
    # Northwest dense block, x in [-4.7, -3.5], y in [+0.5, +2.0]
    bbox_min: [-4.8, 0.5, -1.38]
    bbox_max: [-3.4, 1.9, -0.3]
    kind: object
  - query: "a bed"
    # Southeast diagonal dense cluster around (-1.0, -2.0)
    bbox_min: [-1.7, -2.7, -1.38]
    bbox_max: [-0.3, -1.3, -0.3]
    kind: object
  - query: "a table"
    # Mid-west cluster around (-4.4, +0.5)
    bbox_min: [-5.1, -0.2, -1.38]
    bbox_max: [-3.7, 1.2, -0.4]
    kind: loose
  - query: "a chair"
    # Smaller cluster near (-3.7, +1.5)
    bbox_min: [-4.4, 0.8, -1.38]
    bbox_max: [-3.0, 2.2, -0.3]
    kind: loose
  - query: "a bookshelf"
    # East-edge dense column at x ≈ +1.1, y in [-0.7, +1.5]
    bbox_min: [0.4, -1.0, -1.38]
    bbox_max: [1.24, 1.6, 1.0]
    kind: object
  - query: "a lamp"
    # Far-southwest tall cluster around (-5.0, -1.0)
    bbox_min: [-5.40, -1.7, -1.38]
    bbox_max: [-4.3, -0.4, 1.0]
    kind: loose

  # ---- Structural wall band ----
  - query: "a window"
    # Eastern wall x ≈ +1.1, full y, full z
    bbox_min: [0.9, -3.04, -0.5]
    bbox_max: [1.24, 2.69, 1.2]
    kind: structural
