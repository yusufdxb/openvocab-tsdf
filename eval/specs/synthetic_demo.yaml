# Eval spec for the synthetic demo scene produced by scripts/demo_synthetic.py
# (red sphere at (0, -0.2, 0) r=0.25; green floor slab y ∈ [0.25, 0.35];
#  blue bar x ∈ [0.55, 0.65], y ∈ [-0.4, 0.3]).

model: ViT-B-16
pretrained: laion2b_s34b_b88k
device: cuda:0
dtype: fp16

top_percentile: 0.02
cluster_eps_vox: 2
min_cluster_voxels: 8
top_k: 5

cases:
  - query: "a red ball"
    bbox_min: [-0.25, -0.45, -0.25]
    bbox_max: [0.25, 0.05, 0.25]
  - query: "a blue bar"
    bbox_min: [0.45, -0.45, -0.20]
    bbox_max: [0.75, 0.35, 0.20]
  - query: "green grass floor"
    bbox_min: [-0.80, 0.15, -0.80]
    bbox_max: [0.80, 0.45, 0.80]
